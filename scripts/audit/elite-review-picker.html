<html lang="uk">

    <meta charset="utf-8" />

    <title>Elite review picker</title>
    <style>
      :root {
        --bg: #0b1018;
        --surface: #151c28;
        --surface2: #1c2534;
        --border: #2a3548;
        --text: #e8eef7;
        --muted: #8b98ad;
        --accent: #6ee0c8;
        --keep: #4ade80;
        --remove: #f87171;
        --warn: #fbbf24;
        --touch: 44px;
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .shell {
        max-width: 760px;
        margin: 0 auto;
        padding: 20px 16px 120px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 6px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 16px;
        font-size: 0.9rem;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      .pill {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.8rem;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      .chip {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
        min-height: 32px;
      }
      .chip.active {
        border-color: var(--accent);
        color: var(--accent);
      }
      .search {
        width: 100%;
        min-height: var(--touch);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        padding: 0 14px;
        font-size: 1rem;
        margin-bottom: 12px;
      }
      .nav-row {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .btn {
        border: 1px solid var(--border);
        background: var(--surface2);
        color: var(--text);
        border-radius: var(--radius);
        padding: 10px 14px;
        cursor: pointer;
        min-height: var(--touch);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #041018;
        font-weight: 700;
      }
      .btn.danger {
        border-color: #7f1d1d;
        color: var(--remove);
      }
      .btn.ghost {
        background: transparent;
      }
      .btn:disabled {
        opacity: 0.4;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
      }
      .card.resolved {
        opacity: 0.6;
      }
      .kind {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .word {
        font-size: 2rem;
        font-weight: 800;
        margin: 0 0 8px;
      }
      .meta {
        color: var(--muted);
        font-size: 0.85rem;
        margin: 0 0 8px;
      }
      .scores {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 0 0 12px;
      }
      .hint {
        color: var(--warn);
        font-size: 0.85rem;
        margin: 0 0 12px;
      }
      .fail {
        color: var(--remove);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .rewrite {
        width: 100%;
        min-height: 40px;
        margin-top: 10px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        padding: 0 10px;
      }
      .footer-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: #0b1018ee;
        border-top: 1px solid var(--border);
        padding: 12px 16px;
      }
      .footer-inner {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .kbd {
        font-family: ui-monospace, monospace;
        background: var(--surface2);
        padding: 1px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>Elite review picker</h1>
        <p class="sub">
          A accept · R reject · ← move elite · → keep hard · H accept hard · W rewrite+accept
        </p>
        <div class="pills" id="progress"></div>
        <div class="chips" id="filters"></div>
        <input class="search" id="search" type="search" placeholder="Пошук…" autocomplete="off" />
        <div class="nav-row">
          <button class="btn" id="prev" type="button">← Prev</button>
          <button class="btn" id="next" type="button">Next →</button>
          <button class="btn ghost" id="undo" type="button">Undo</button>
        </div>
      </header>
      <main id="main"></main>
    </div>
    <div class="footer-bar">
      <div class="footer-inner">
        <span class="sub" id="footer-status" style="margin: 0"
          >Рішення в браузері, поки не завантажиш JSON</span
        >
        <button class="btn primary" id="download" type="button">Download decisions</button>
      </div>
    </div>

    <script>
      (function () {
        const STORAGE_KEY = 'kapelyuh-elite-review-v1';
        const payload = JSON.parse(document.getElementById('payload').textContent);
        const cards = payload.cards;
        const state = { filter: 'unresolved', search: '', index: 0, items: loadItems(), undo: [] };

        function loadItems() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return {};
            return JSON.parse(raw).byId || {};
          } catch {
            return {};
          }
        }
        function persist() {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({ byId: state.items, exportedAt: new Date().toISOString() }),
          );
        }
        function filtered() {
          const q = state.search.trim().toLowerCase();
          return cards.filter((card) => {
            if (state.filter === 'new-review' && card.kind !== 'new-review') return false;
            if (state.filter === 'hard-candidate' && card.kind !== 'hard-candidate') return false;
            if (state.filter === 'hard-refill' && card.kind !== 'hard-refill') return false;
            if (state.filter === 'unresolved' && state.items[card.id]) return false;
            if (state.filter === 'resolved' && !state.items[card.id]) return false;
            if (q && !card.text.toLowerCase().includes(q) && !card.category.includes(q))
              return false;
            return true;
          });
        }
        function counts() {
          let accept = 0,
            reject = 0,
            move = 0,
            hard = 0,
            unresolved = 0;
          for (const card of cards) {
            const item = state.items[card.id];
            if (!item) unresolved += 1;
            else if (item.action === 'accept') accept += 1;
            else if (item.action === 'reject') reject += 1;
            else if (item.action === 'move-elite') move += 1;
            else if (item.action === 'accept-hard') hard += 1;
          }
          return { accept, reject, move, hard, unresolved };
        }
        function decide(card, item) {
          state.undo.push({
            id: card.id,
            prev: state.items[card.id] ? { ...state.items[card.id] } : null,
          });
          state.items[card.id] = item;
          persist();
          const list = filtered();
          const stillVisible = list.some((c) => c.id === card.id);
          if (stillVisible && state.index < list.length - 1) state.index += 1;
          render();
        }
        function kindLabel(kind) {
          if (kind === 'hard-candidate') return 'Hard → elite candidate';
          if (kind === 'hard-refill') return 'Hard refill review';
          return 'New elite review';
        }
        function renderCard(card) {
          const item = state.items[card.id];
          const scores =
            'alias ' +
            card.alias +
            ' · crocodile ' +
            card.crocodile +
            ' · association ' +
            card.association +
            (card.pass ? ' · pass' : ' · FAIL');
          let actions = '';
          if (card.kind === 'new-review') {
            actions =
              '<button class="btn primary" data-act="accept">Accept <span class="kbd">A</span></button>' +
              '<button class="btn danger" data-act="reject">Reject <span class="kbd">R</span></button>' +
              '<button class="btn ghost" data-act="rewrite">Rewrite+accept <span class="kbd">W</span></button>';
          } else if (card.kind === 'hard-candidate') {
            actions =
              '<button class="btn primary" data-act="move-elite">Move elite <span class="kbd">←</span></button>' +
              '<button class="btn ghost" data-act="keep-hard">Keep hard <span class="kbd">→</span></button>';
          } else {
            actions =
              '<button class="btn primary" data-act="accept-hard">Accept hard <span class="kbd">H</span></button>' +
              '<button class="btn danger" data-act="reject">Reject <span class="kbd">R</span></button>';
          }
          const hints = [];
          if (card.subsetOf) hints.push('subset of «' + card.subsetOf + '»');
          if (card.shapeError) hints.push(card.shapeError);
          if (item) hints.push('decision: ' + item.action + (item.text ? ' → ' + item.text : ''));
          return (
            '<article class="card' +
            (item ? ' resolved' : '') +
            '">' +
            '<div class="kind">' +
            kindLabel(card.kind) +
            '</div>' +
            '<p class="word"></p>' +
            '<p class="meta">' +
            card.category +
            ' · ' +
            card.difficulty +
            ' · ' +
            card.status +
            ' · ' +
            card.id +
            '</p>' +
            '<p class="meta scores' +
            (card.pass ? '' : ' fail') +
            '">' +
            scores +
            '</p>' +
            (hints.length ? '<p class="hint">' + hints.join(' · ') + '</p>' : '') +
            '<div class="actions">' +
            actions +
            '</div>' +
            '<input class="rewrite" id="rewrite" placeholder="Новий текст для rewrite" value="' +
            (item && item.text ? item.text : '') +
            '" />' +
            '</article>'
          );
        }
        function bind(card) {
          const root = document.querySelector('.card');
          if (!root) return;
          root.querySelector('.word').textContent = card.text;
          root.querySelectorAll('[data-act]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const action = btn.getAttribute('data-act');
              if (action === 'rewrite') {
                const text = (document.getElementById('rewrite').value || '').trim();
                if (!text) {
                  alert('Впиши новий текст');
                  return;
                }
                decide(card, { id: card.id, action: 'rewrite', text, accept: true });
                return;
              }
              decide(card, { id: card.id, action });
            });
          });
        }
        function exportDecisions() {
          const items = Object.values(state.items).sort((a, b) => a.id.localeCompare(b.id));
          return {
            items,
            exportedAt: new Date().toISOString(),
            meta: { generatedAt: payload.generatedAt, total: cards.length },
          };
        }
        function render() {
          const list = filtered();
          if (state.index >= list.length) state.index = Math.max(0, list.length - 1);
          const c = counts();
          document.getElementById('progress').innerHTML =
            '<span class="pill">' +
            (list.length ? state.index + 1 : 0) +
            ' / ' +
            list.length +
            '</span>' +
            '<span class="pill">accept ' +
            c.accept +
            '</span>' +
            '<span class="pill">reject ' +
            c.reject +
            '</span>' +
            '<span class="pill">move ' +
            c.move +
            '</span>' +
            '<span class="pill">hard ' +
            c.hard +
            '</span>' +
            '<span class="pill">open ' +
            c.unresolved +
            '</span>';
          const filters = [
            ['unresolved', 'Open'],
            ['new-review', 'New'],
            ['hard-candidate', 'Hard→elite'],
            ['hard-refill', 'Hard refill'],
            ['resolved', 'Done'],
            ['all', 'All'],
          ];
          document.getElementById('filters').innerHTML = filters
            .map(
              ([id, label]) =>
                '<button type="button" class="chip' +
                (state.filter === id ? ' active' : '') +
                '" data-filter="' +
                id +
                '">' +
                label +
                '</button>',
            )
            .join('');
          const main = document.getElementById('main');
          const card = list[state.index];
          if (!card) {
            main.innerHTML = '<p class="sub">Немає карток у цьому фільтрі.</p>';
          } else {
            main.innerHTML = renderCard(card);
            bind(card);
          }
          document.getElementById('prev').disabled = state.index <= 0;
          document.getElementById('next').disabled = !list.length || state.index >= list.length - 1;
        }
        document.getElementById('filters').addEventListener('click', (e) => {
          const btn = e.target.closest('[data-filter]');
          if (!btn) return;
          state.filter = btn.getAttribute('data-filter');
          state.index = 0;
          render();
        });
        document.getElementById('search').addEventListener('input', (e) => {
          state.search = e.target.value;
          state.index = 0;
          render();
        });
        document.getElementById('prev').addEventListener('click', () => {
          if (state.index > 0) {
            state.index -= 1;
            render();
          }
        });
        document.getElementById('next').addEventListener('click', () => {
          const list = filtered();
          if (state.index < list.length - 1) {
            state.index += 1;
            render();
          }
        });
        document.getElementById('undo').addEventListener('click', () => {
          const entry = state.undo.pop();
          if (!entry) return;
          if (entry.prev) state.items[entry.id] = entry.prev;
          else delete state.items[entry.id];
          persist();
          render();
        });
        document.getElementById('download').addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(exportDecisions(), null, 2)], {
            type: 'application/json',
          });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'elite-review-decisions.json';
          a.click();
          URL.revokeObjectURL(a.href);
        });
        let keyHeld = false;
        document.addEventListener('keyup', () => {
          keyHeld = false;
        });
        document.addEventListener('keydown', (e) => {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
          if (e.repeat || keyHeld) return;
          const list = filtered();
          const card = list[state.index];
          if (!card) return;
          const key = e.key.toLowerCase();
          const decideOnce = (item) => {
            keyHeld = true;
            e.preventDefault();
            decide(card, item);
          };
          if (key === 'a' && card.kind === 'new-review') {
            decideOnce({ id: card.id, action: 'accept' });
            return;
          }
          if (key === 'r' && card.kind !== 'hard-candidate') {
            decideOnce({ id: card.id, action: 'reject' });
            return;
          }
          if ((key === 'm' || key === 'arrowleft') && card.kind === 'hard-candidate') {
            decideOnce({ id: card.id, action: 'move-elite' });
            return;
          }
          if ((key === 'k' || key === 'arrowright') && card.kind === 'hard-candidate') {
            decideOnce({ id: card.id, action: 'keep-hard' });
            return;
          }
          if (key === 'h' && card.kind === 'hard-refill') {
            decideOnce({ id: card.id, action: 'accept-hard' });
            return;
          }
          if (key === 'arrowleft' && state.index > 0) {
            e.preventDefault();
            state.index -= 1;
            render();
          }
          if (key === 'arrowright' && state.index < list.length - 1) {
            e.preventDefault();
            state.index += 1;
            render();
          }
        });
        render();
      })();
    </script>
